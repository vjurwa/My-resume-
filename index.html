
<!DOCTYPE html>
<html>
<head>
<title>Vjurwa Portfolio</title>
<style>
body{font-family:Arial;background:#f0f0f0;margin:0}
header{background:#1e3a8a;color:white;text-align:center;padding:20px}
.container{max-width:800px;margin:20px auto;padding:20px}
.section{background:white;padding:20px;border-radius:10px;margin-bottom:20px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.box{background:#ff9800;color:white;text-align:center;padding:50px;border-radius:10px;font-size:20px;font-weight:bold;cursor:pointer;transition:0.3s}
.box:hover{transform:rotate(45deg) scale(1.3);background:red;box-shadow:0 0 20px red}
marquee{background:#1e3a8a;color:white;padding:10px}
footer{text-align:center;padding:10px}
.cv-btn{background:#1e3a8a;color:white;padding:12px 25px;text-decoration:none;border-radius:8px;font-weight:bold;display:inline-block;transition:0.3s}
.cv-btn:hover{background:orange;transform:scale(1.1)}
.transform-title{background:#0000ff;color:white;text-align:center;padding:10px;font-size:22px;font-weight:bold;margin-bottom:20px}
.box-container{display:flex;flex-direction:column;gap:15px;padding:10px}
.t-box{width:100px;height:100px;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;font-weight:bold;transition:0.5s ease;cursor:pointer}
.red-box{background:red;color:black}
.yellow-box{background:yellow;color:black}
.blue-box{background:blue;color:white}
.green-box{background:green;color:white}
.red-box:hover{transform:rotate(45deg)}
.yellow-box:hover{transform:translateX(100px)}
.blue-box:hover{transform:scaleY(1.5)}
.green-box:hover{transform:scaleX(1.8)}
  .welcome-marquee{
  background:#0000ff;
  color:white;
  padding:10px;
  font-weight:bold;
  margin:15px 0;
  border-radius:5px;
  }
  </style>
</head>
<body>

<header>
  <h1>Vjurwa</h1>
  <p>Designer | Data entry | Creator</p>
</header>

<div class="container">

  <div class="section">
    <h2>My Resume</h2>
    <p><b>Name:</b> Vjurwa</p>
    <p><b>Role:</b> Basic Html, Css & Data entry</p>
  <div class="section">
     <marquee class="welcome-marquee" behavior="scroll" direction="left">
    🚀 Welcome to My CSS Transform Project
  </marquee>
<div class="box-container">
  <div class="t-box red-box">rotate<br>me</div>
  
  <div class="t-box yellow-box">move<br>me</div>
  
  <div class="t-box blue-box">make me<br>stretch</div>
  
  <div class="t-box green-box">make me<br>wider</div>

    <!-- CV BUTTON -->
    <div style="text-align:center; margin:20px 0;">
      <a href="https://raw.githubusercontent.com/vjurwa/Resume.md/main/resume.md" target="_blank" class="cv-btn">📄 Meri CV Dekho</a>
  </div>
<footer>
  <p>© 2026 Vjurwa</p>
</footer>

</body>
</html>
