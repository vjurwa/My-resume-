
<!DOCTYPE html>
<html>
<head>
<title>Vjurwa - Resume</title>
<style>
body { font-family: Arial; background: #fff3cd; margin:0; padding:0; }
header { background: #1e3a8a; color: white; text-align: center; padding: 20px; }
.container { padding: 20px; }
.section { background: white; margin: 20px 0; padding: 15px; border-radius: 8px; }

.box {
  width: 150px; 
  height: 150px; 
  background: orange;  /* Orange box */
  margin: 30px auto; 
  display: flex; 
  align-items: center; 
  justify-content: center;
  color: white;
  font-weight: bold; 
  border-radius: 10px; 
  transition: all 0.3s;
  cursor: pointer;
}

.box:hover, .box:active {
  transform: rotate(45deg) scale(1.3); /* ghumega */
  background: red;
  box-shadow: 0px 0px 20px red;
}

marquee { background: #1e3a8a; color: white; padding: 10px; }
footer { text-align: center; padding: 10px; background: #1e3a8a; color: white; }
</style>
</head>
<body>

<header>
  <h1>Vjurwa</h1>
  <p>Designer | Data entry | Creator</p>
</header>

<div class="container">

  <div class="section">
    <h2>My Resume</h2>
    <p><b>Name:</b> Vjurwa</p>
    <p><b>Role:</b> Basic Html, Css & Data entry</p>

    <!-- BOX YAHAN HAI -->
    <p style="text-align:center;">Is box ko touch karo 👇</p>
    <div class="box" tabindex="0">Touch Me</div>

  </div>

  <div class="section">
    <marquee behavior="scroll" direction="left" scrollamount="5">
      🚀 Welcome to My CSS Transform Project 🚀
    </marquee>
  </div>

</div>

<footer>
  <p>© 2026 Vjurwa. All rights reserved.</p>
</footer>

</body>
</html>
