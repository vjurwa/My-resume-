
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vjurwa - Resume</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; margin: 0; padding: 0; color: #333; }
    header { background: #333; color: white; padding: 20px; text-align: center; }
    .container { max-width: 900px; margin: 20px auto; background: white; padding: 30px; border-radius: 8px; }
    h1, h2 { color: #0073e6; text-align: center; }
    .section { margin-bottom: 30px; }
    .box {
      width: 150px; height: 150px; background: #0073e6; color: white;
      margin: 30px auto; display: flex; align-items: center; justify-content: center;
      font-weight: bold; border-radius: 10px; transition: 0.5s; cursor: pointer;
    }
    .box:hover, .box:active { 
  transform: rotate(45deg) scale(1.3); 
  background: #e60000; 
  box-shadow: 0px 0px 20px red;
    }
    footer { text-align: center; padding: 20px; background: #333; color: white; }
marquee {
  margin-top: 30px;
  font-size: 18px;
  font-weight: bold;
  color: #1e3a8a; /* blue color */
  background: #fff3cd; /* halka yellow background */
  padding: 10px;
  border-radius: 8px;
      }
  </style>
</head>
<body>
  <header>
    <h1>Vjurwa</h1>
    <p>Designer | Data entry | Creator</p>
  </header>

  <div class="container">
    
    <div class="section">
      <h2>My Resume</h2>
      <p><b>Name:</b> Vjurwa</p>
      <p><b>Role:</b> Basic Html,Css& Data entry</p>
    </div>

    <div class="section">
     <marquee behavior="scroll" direction="left" scrollamount="5">
  🚀 Welcome to My CSS Transform Project 🚀
     </marquee>

      <p style="text-align:center;">Is box ko touch karo / click karo 👇</p>
      <div class="box" tabindex="0">Touch Me</div>
    </div>
  <footer>
    <p>© 2026 Vjurwa. All rights reserved.</p>
  </footer>
</body>
</html>
