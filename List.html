<!DOCTYPE html>
<html>
  <head>
    <title>Drop-down List</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
       select{background-color: green;
       color: white; width: 88px; height:62px;}
      select option{background-color:yellow;
       color: orange;}
    </style>
  </head>
  <body>
      <select>
          <option>--academic--</option>
          <option>9th</option>
          <option>10th</option>

      </select> 
      <select>
          <option>--Computer Course--</option>
          <optgroup label="4 month Course"</optgroup>
          <option>Html</option>
          <option>Css</option>
          <optgroup label="5 month course">
          <option>Ms Office</option>
          <option>Graphic</option>
      </select> 
        <select>
          <option>--Spoken English--</option>
          <option>Basic</option>
          <option>Intermediate</option>
          <option>Advance</option>
          <option>Expert</option>
      </select> 
  </body>
</html>
