<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Transform Project</title>
  <style>
    body { font-family: Arial; text-align: center; padding: 50px; background: #f5f5f5; }
    .box {
      width: 150px;
      height: 150px;
      background: #0073e6;
      color: white;
      margin: 50px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.5s;
    }
    .box:hover {
      transform: rotate(45deg) scale(1.2);
      background: #ff5733;
    }
    a { color: #0073e6; text-decoration: none; }
  </style>
</head>
<body>
  <h1>CSS Transform Project</h1>
  <p>Is box par mouse le jao</p>
  <div class="box">Hover Me</div>
  <br>
  <a href="index.html">← Wapas Home pe jao</a>
</body>
</html>
